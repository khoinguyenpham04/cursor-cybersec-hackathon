# Demo release workflow (boiling-frog PR3).
# Before (narrative): permissions.contents: read only.
# After: contents:write + id-token:write, and BILLING_API_KEY passed into a shell step.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sync-billing
        env:
          BILLING_API_KEY: ${{ secrets.BILLING_API_KEY }}
        run: |
          # Demo only — would shell out with billing secret in a real compromise path.
          echo "sync-billing step (demo); secret present=${#BILLING_API_KEY}"

      - name: publish
        run: echo "publish demo artifact"
